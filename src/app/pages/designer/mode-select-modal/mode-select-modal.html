<nz-modal
  [nzVisible]="visible()"
  [nzFooter]="null"
  [nzClosable]="false"
  [nzCentered]="true"
  nzWidth="680px"
  (nzOnCancel)="onCancel()"
>
  <ng-container *nzModalContent>
    <button type="button" class="close-btn" (click)="onCancel()" aria-label="Schließen">
      <nz-icon nzType="close" nzTheme="outline" />
    </button>

    <h2 class="modal-title">Was möchtest du machen?</h2>
    <p class="modal-subtitle">Wähle, wie Roomly dein Bild bearbeiten soll.</p>

    <div class="option-grid">
      <button type="button" class="option-card" (click)="choose('redesign')">
        <span class="option-icon">
          <nz-icon nzType="home" nzTheme="outline" />
        </span>
        <span class="option-title">Raum komplett neu gestalten</span>
        <span class="option-desc">Die KI entwirft den ganzen Raum neu.</span>
        <span class="option-cta">
          Auswählen
          <nz-icon nzType="arrow-right" nzTheme="outline" />
        </span>
      </button>

      <button type="button" class="option-card" (click)="choose('furniture')">
        <span class="option-icon">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20" aria-hidden="true">
            <path
              d="M4 12v-1a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <path
              d="M3 12.5A1.5 1.5 0 0 1 4.5 11h15a1.5 1.5 0 0 1 1.5 1.5V16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3.5Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
            <path d="M4 17v2M20 17v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </span>
        <span class="option-title">Einzelne Möbel austauschen</span>
        <span class="option-desc">Markiere Möbel und tausche sie gezielt.</span>
        <span class="option-cta">
          Auswählen
          <nz-icon nzType="arrow-right" nzTheme="outline" />
        </span>
      </button>
    </div>
  </ng-container>
</nz-modal>
