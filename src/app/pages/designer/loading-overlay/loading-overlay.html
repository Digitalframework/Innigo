@if (visible()) {
  <div class="overlay">
    <div class="card">
      <div class="spinner">
        <span class="spinner-ring"></span>
        <span class="spinner-mark">✽</span>
      </div>
      <h3 class="title">Dein Raum wird gestaltet</h3>
      <p class="message">{{ messages[messageIndex()] }}</p>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>
}
